<script>
/* store.js */
/* store.js – Datenzugriff mit zwei Backends (gleiche API für beide):
     * Supabase, wenn CONFIG.SUPABASE_URL + SUPABASE_ANON_KEY gesetzt sind
     * Demo, wenn nicht: localStorage
   Beide Backends spiegeln zusätzlich in den lokalen Cache, damit die Stempeluhr
   offline weiterläuft. Schreibvorgänge, die Supabase nicht erreichen, landen in
   einer Warteschlange (pz_queue) und werden beim nächsten Aufruf nachgesendet.
   Einsätze werden über die RPC zeiten_beenden() abgeschlossen (anon darf die
   Tabelle nicht direkt aktualisieren). */
'use strict';

var Store = (function () {
  'use strict';

  var KEY = {
    zeiten: 'pz_zeiten',
    queue: 'pz_queue',
    kuerzel: 'pz_kuerzel',
    demoAuth: 'pz_demo_auth',
    standorte: 'pz_standorte',
    personal: 'pz_personal'
  };

  var TZ = 'Europe/Berlin';
  var mode = 'demo';   // 'demo' | 'supabase'
  var sb = null;       // Supabase-Client für Admin (kann Sitzung halten)
  var sbAnon = null;   // Supabase-Client für die Stempeluhr (immer ohne Sitzung)

  function msg(key) { return (typeof t === 'function') ? t(key) : key; }

  /* ---------------------------------------------------------------- Speicher */

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }

  function write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* Speicher voll */ }
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function cache() { return read(KEY.zeiten, []); }
  function saveCache(arr) { write(KEY.zeiten, arr); }

  function cacheGet(id) {
    var arr = cache();
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  function cachePut(rec) {
    var arr = cache();
    var i = arr.findIndex(function (z) { return z.id === rec.id; });
    if (i >= 0) arr[i] = Object.assign({}, arr[i], rec);
    else arr.push(rec);
    saveCache(arr);
    return rec;
  }

  function cachePatch(id, patch) {
    var arr = cache();
    var i = arr.findIndex(function (z) { return z.id === id; });
    if (i < 0) return null;
    arr[i] = Object.assign({}, arr[i], patch);
    saveCache(arr);
    return arr[i];
  }

  function cacheDrop(id) {
    var arr = cache().filter(function (z) { return z.id !== id; });
    saveCache(arr);
  }

  /* "_pending" (nur lokal, wartet auf Übertragung) aus dem Cache entfernen. */
  function clearPending(id) {
    var arr = cache();
    var i = arr.findIndex(function (z) { return z.id === id; });
    if (i < 0 || !('_pending' in arr[i])) return;
    delete arr[i]._pending;
    saveCache(arr);
  }

  function queue() { return read(KEY.queue, []); }
  function queuePush(op) { var q = queue(); q.push(op); write(KEY.queue, q); }

  /* ------------------------------------------------------------- Zeit-Helfer */

  var dtf = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

  /* Wanduhr-Werte in Europe/Berlin (auch wenn das Gerät anders eingestellt ist). */
  function parts(ts) {
    var d = new Date(ts);
    var o = {};
    dtf.formatToParts(d).forEach(function (p) { if (p.type !== 'literal') o[p.type] = p.value; });
    return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second };
  }

  /* Differenz Berlin-Zeit minus UTC in ms (+1 h Winter, +2 h Sommer). */
  function offsetMs(ts) {
    var d = new Date(ts);
    var base = Math.floor(d.getTime() / 1000) * 1000;
    var p = parts(base);
    return Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s) - base;
  }

  /* Berliner Wanduhr-Zeit -> UTC-Millisekunden. */
  function zonedToUtc(y, m, d, h, mi) {
    var wall = Date.UTC(y, m - 1, d, h || 0, mi || 0, 0);
    var ts = wall - offsetMs(wall);
    ts = wall - offsetMs(ts);
    return ts;
  }

  /* Monatsgrenzen (Berlin) als ISO-Strings für Supabase-Filter. */
  function monthRange(y, m) {
    var fromMs = zonedToUtc(y, m, 1, 0, 0);
    var ny = m === 12 ? y + 1 : y;
    var nm = m === 12 ? 1 : m + 1;
    var nextMs = zonedToUtc(ny, nm, 1, 0, 0);
    return {
      fromMs: fromMs,
      toMs: nextMs - 1,
      from: new Date(fromMs).toISOString(),
      to: new Date(nextMs - 1).toISOString()
    };
  }

  function msToHms(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    return [h, m, r].map(function (n) { return String(n).padStart(2, '0'); }).join(':');
  }

  function hours(ms) { return ms / 3600000; }

  function fmtHours(ms) {
    var loc = (typeof getLang === 'function' && getLang() === 'en') ? 'en-GB' : 'de-DE';
    return hours(ms).toLocaleString(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtTime(ts) {
    var p = parts(ts);
    return String(p.h).padStart(2, '0') + ':' + String(p.mi).padStart(2, '0');
  }

  function fmtDate(ts) {
    var p = parts(ts);
    return String(p.d).padStart(2, '0') + '.' + String(p.m).padStart(2, '0') + '.' + p.y;
  }

  function nowParts() { return parts(Date.now()); }

  /* ------------------------------------------------------------ Supabase-Teil */

  function hasSupabase() {
    var u = (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_URL) ? String(CONFIG.SUPABASE_URL).trim() : '';
    var k = (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_ANON_KEY) ? String(CONFIG.SUPABASE_ANON_KEY).trim() : '';
    if (!u || !k) return false;
    if (!/^https?:\/\//.test(u)) return false;
    if (/dein-projekt|your-project|xxxx/i.test(u)) return false;
    return true;
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('supabase-js konnte nicht geladen werden')); };
      document.head.appendChild(s);
      setTimeout(function () { reject(new Error('supabase-js: Zeitüberschreitung')); }, 8000);
    });
  }

  function offlineError() {
    var e = new Error('keine Verbindung');
    e.offline = true;
    return e;
  }

  /* lokale Flags (_pending) nicht an die Datenbank senden */
  function clean(obj) {
    var out = {};
    Object.keys(obj || {}).forEach(function (k) {
      if (k.charAt(0) !== '_') out[k] = obj[k];
    });
    return out;
  }

  async function remoteInsert(rec) {
    if (!sbAnon) throw offlineError();
    var res = await sbAnon.from('zeiten').insert(clean(rec));
    if (res.error) throw res.error;
  }

  /* Abschluss eines Einsatzes: anon hat kein UPDATE-Recht, deshalb RPC. */
  async function remoteUpdate(id, patch) {
    if (!sbAnon) throw offlineError();
    var res = await sbAnon.rpc('zeiten_beenden', {
      p_id: id,
      p_ende: (patch && patch.ende_ts) || null,
      p_notiz: (patch && patch.notiz) || null,
      p_foto: (patch && patch.foto_url) || null
    });
    if (res.error) throw res.error;
  }

  /* E-Mail-Benachrichtigung: nur Aufruf, Versand macht die Edge Function.
     Fire-and-forget, kein Fehler darf den Ablauf stören. */
  function notifyEnde(id, patch) {
    var url = (typeof CONFIG !== 'undefined' && CONFIG.NOTIFY_URL) ? String(CONFIG.NOTIFY_URL).trim() : '';
    if (!url || !/^https?:\/\//.test(url)) return;
    var rec = cacheGet(id) || {};
    var body = {
      kuerzel: rec.kuerzel || '',
      objekt: rec.objekt || '',
      start_ts: rec.start_ts || null,
      ende_ts: (patch && patch.ende_ts) || rec.ende_ts || null,
      notiz: (patch && patch.notiz != null) ? patch.notiz : (rec.notiz || null),
      foto_url: (patch && patch.foto_url != null) ? patch.foto_url : (rec.foto_url || null)
    };
    if (!body.ende_ts) return;
    try {
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (res) {
        if (!res.ok) console.warn('notify: HTTP ' + res.status);
      }).catch(function (e) {
        console.warn('notify:', (e && e.message) ? e.message : e);
      });
    } catch (e) {
      console.warn('notify:', (e && e.message) ? e.message : e);
    }
  }

  /* ------------------------------------------------------------- Öffentliche API */

  async function init() {
    mode = hasSupabase() ? 'supabase' : 'demo';
    if (mode === 'supabase') {
      try {
        if (!window.supabase) await loadScript('https://unpkg.com/@supabase/supabase-js@2');
        if (window.supabase && window.supabase.createClient) {
          /* Standard-Client: kann eine Admin-Sitzung halten (admin.html). */
          sb = window.supabase.createClient(
            CONFIG.SUPABASE_URL.trim(),
            CONFIG.SUPABASE_ANON_KEY.trim(),
            { auth: { persistSession: true, autoRefreshToken: true } }
          );
          /* Zweiter Client für die Stempeluhr: bewusst OHNE Sitzung und mit
             eigenem Storage-Schlüssel. Sonst würde auf einem Gerät, auf dem
             sich der Admin angemeldet hat, auch die Stempeluhr als
             "authenticated" laufen – und die Schreibrechte (anon) nicht haben. */
          sbAnon = window.supabase.createClient(
            CONFIG.SUPABASE_URL.trim(),
            CONFIG.SUPABASE_ANON_KEY.trim(),
            { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'pz-cleaner' } }
          );
        }
      } catch (e) { sb = null; }
    }
    try { await flush(); } catch (e) { /* Warteschlange bleibt liegen */ }
    return mode;
  }

  /* Nachsenden: gibt die Anzahl erfolgreich übertragener Vorgänge zurück.
     Bei einem Fehler bleibt der Rest in der Warteschlange (Reihenfolge zählt). */
  async function flush() {
    if (mode !== 'supabase') { write(KEY.queue, []); return 0; }
    var q = queue();
    if (!q.length) return 0;
    var sent = 0;
    var rest = [];
    var sentIds = [];
    for (var i = 0; i < q.length; i++) {
      var op = q[i];
      try {
        if (op.type === 'insert') await remoteInsert(op.rec);
        else if (op.type === 'update') await remoteUpdate(op.id, op.patch);
        sent++;
        sentIds.push(op.type === 'insert' ? op.rec.id : op.id);
        if (op.type === 'update') notifyEnde(op.id, op.patch);
      } catch (e) {
        if (e && e.code === '23505') { // Datensatz existierte schon
          sent++;
          sentIds.push(op.type === 'insert' ? op.rec.id : op.id);
          continue;
        }
        rest = q.slice(i);
        break;
      }
    }
    write(KEY.queue, rest);

    /* Bekannter Fehler: "WARTET" blieb nach erfolgreichem Senden stehen.
       Deshalb hier die lokale Markierung entfernen – aber nur, wenn für den
       Eintrag kein weiterer Vorgang in der Warteschlange liegt. */
    sentIds.forEach(function (id) {
      var still = rest.some(function (op) {
        return (op.type === 'insert' ? op.rec.id : op.id) === id;
      });
      if (!still) clearPending(id);
    });

    return sent;
  }

  /* Eintrag anlegen. Gibt immer einen Datensatz zurück; ist _pending true,
     liegt er nur lokal in der Warteschlange. */
  async function insertZeit(data) {
    var rec = {
      id: data.id || uuid(),
      kuerzel: String(data.kuerzel || '').trim(),
      objekt: String(data.objekt || '').trim(),
      start_ts: data.start_ts || new Date().toISOString(),
      ende_ts: data.ende_ts || null,
      notiz: data.notiz || null,
      foto_url: data.foto_url || null,
      nachgetragen: !!data.nachgetragen,
      created_at: new Date().toISOString()
    };
    cachePut(rec);
    if (mode === 'demo') return rec;
    try {
      await remoteInsert(rec);
      return rec;
    } catch (e) {
      rec._pending = true;
      cachePut(rec);
      queuePush({ type: 'insert', rec: rec });
      return rec;
    }
  }

  /* Eintrag durch den Admin anlegen (Nachtrag). Läuft über den angemeldeten
     Client, weil anon nur offene Einsätze (ende_ts null) anlegen darf. */
  async function insertZeitAdmin(data) {
    var rec = {
      id: data.id || uuid(),
      kuerzel: String(data.kuerzel || '').trim(),
      objekt: String(data.objekt || '').trim(),
      start_ts: data.start_ts,
      ende_ts: data.ende_ts || null,
      notiz: data.notiz || null,
      nachgetragen: true,
      created_at: new Date().toISOString()
    };
    if (!rec.kuerzel || !rec.objekt || !rec.start_ts) throw new Error(msg('err.fields'));
    if (mode === 'demo') { cachePut(rec); return rec; }
    var res = await sb.from('zeiten').insert(clean(rec));
    if (res.error) throw res.error;
    cachePut(rec);
    return rec;
  }

  /* Felder, die der Admin an einem Einsatz ändern darf. */
  var ADMIN_FELDER = ['start_ts', 'ende_ts', 'kuerzel', 'objekt', 'notiz', 'admin_notiz'];

  /* Eintrag durch den Admin ändern (Korrektur). Die ursprünglichen Zeiten werden
     nur beim ersten Mal festgehalten (original_*), damit die Änderung
     nachvollziehbar bleibt; bearbeitet wird immer gesetzt. */
  async function updateZeitAdmin(id, patch) {
    patch = patch || {};
    var allowed = {};
    ADMIN_FELDER.forEach(function (k) {
      if (patch[k] !== undefined) allowed[k] = patch[k];
    });
    if (!Object.keys(allowed).length) throw new Error(msg('err.fields'));

    function originalPatch(before) {
      var out = { bearbeitet: true };
      if (!before.original_start_ts && before.start_ts) out.original_start_ts = before.start_ts;
      if (!before.original_ende_ts && before.ende_ts) out.original_ende_ts = before.ende_ts;
      return out;
    }

    if (mode === 'demo') {
      var cur = cacheGet(id);
      if (!cur) throw new Error(msg('err.notFound'));
      var upd = originalPatch(cur);
      ADMIN_FELDER.forEach(function (k) { if (allowed[k] !== undefined) upd[k] = allowed[k]; });
      return cachePatch(id, upd);
    }

    var got = await sb.from('zeiten')
      .select('start_ts,ende_ts,original_start_ts,original_ende_ts')
      .eq('id', id).single();
    if (got.error) throw got.error;

    var upd2 = originalPatch(got.data || {});
    ADMIN_FELDER.forEach(function (k) { if (allowed[k] !== undefined) upd2[k] = allowed[k]; });

    var res = await sb.from('zeiten').update(upd2).eq('id', id);
    if (res.error) throw res.error;
    cachePatch(id, upd2);
    return cacheGet(id);
  }

  /* Meldestatus für eine Liste von IDs setzen. Gibt die Anzahl zurück. */
  async function setGemeldet(ids, gemeldet) {
    ids = (ids || []).filter(function (v) { return !!v; });
    if (!ids.length) return 0;
    var an = !!gemeldet;
    var patch = { gemeldet: an, gemeldet_am: an ? new Date().toISOString() : null };

    if (mode === 'demo') {
      var n = 0;
      ids.forEach(function (id) { if (cachePatch(id, patch)) n++; });
      return n;
    }
    var res = await sb.from('zeiten').update(patch).in('id', ids);
    if (res.error) throw res.error;
    ids.forEach(function (id) { cachePatch(id, patch); });
    return ids.length;
  }

  /* Meldestatus für einen Zeitraum (Monat) über die RPC setzen.
     p_bis ist exklusiv; laufende Einsätze werden in der Funktion übersprungen.
     Gibt die Anzahl geänderter Zeilen zurück. */
  async function setGemeldetZeitraum(o) {
    o = o || {};
    var an = !!o.gemeldet;
    var kuerzel = o.kuerzel ? String(o.kuerzel) : null;
    var objekt = o.objekt ? String(o.objekt) : null;

    if (mode === 'demo') {
      var fromMs = o.from ? Date.parse(o.from) : -Infinity;
      var toMs = o.to ? Date.parse(o.to) : Infinity;
      var arr = cache();
      var n = 0;
      arr.forEach(function (z) {
        var t = Date.parse(z.start_ts);
        if (t < fromMs || t >= toMs) return;
        if (!z.ende_ts) return;
        if (kuerzel && z.kuerzel !== kuerzel) return;
        if (objekt && z.objekt !== objekt) return;
        z.gemeldet = an;
        z.gemeldet_am = an ? new Date().toISOString() : null;
        n++;
      });
      saveCache(arr);
      return n;
    }

    var res = await sb.rpc('zeiten_gemeldet_setzen', {
      p_von: o.from,
      p_bis: o.to,
      p_gemeldet: an,
      p_kuerzel: kuerzel,
      p_objekt: objekt
    });
    if (res.error) throw res.error;
    return res.data == null ? 0 : Number(res.data);
  }

  /* Eintrag durch den Admin löschen (Fehleingabe). */
  async function deleteZeitAdmin(id) {
    if (mode !== 'demo') {
      var res = await sb.from('zeiten').delete().eq('id', id);
      if (res.error) throw res.error;
    }
    cacheDrop(id);
    return true;
  }

  /* Eintrag ändern (Fertig-Stempeln, Notiz, Foto). */
  async function updateZeit(id, patch) {
    var rec = cachePatch(id, patch);
    if (!rec) throw new Error(msg('err.notFound'));
    if (mode === 'demo') return rec;

    var nochInWarteschlange = queue().some(function (op) {
      return op.type === 'insert' && op.rec.id === id;
    });
    if (nochInWarteschlange) {
      queuePush({ type: 'update', id: id, patch: patch });
      rec._pending = true;
      return cachePut(rec);
    }
    try {
      await remoteUpdate(id, patch);
      clearPending(id);
      notifyEnde(id, patch);
      return cacheGet(id) || rec;
    } catch (e) {
      queuePush({ type: 'update', id: id, patch: patch });
      rec._pending = true;
      return cachePut(rec);
    }
  }

  /* Offener Einsatz (ende_ts null), optional auf ein Kürzel beschränkt. */
  function getOffene(kuerzel) {
    var arr = cache().filter(function (z) { return !z.ende_ts; });
    if (kuerzel) arr = arr.filter(function (z) { return z.kuerzel === kuerzel; });
    arr.sort(function (a, b) { return Date.parse(b.start_ts) - Date.parse(a.start_ts); });
    return arr[0] || null;
  }

  /* Liste für einen Zeitraum. offline=true heißt: Daten kommen aus dem Cache. */
  async function listZeiten(opts) {
    var from = opts && opts.from;
    var to = opts && opts.to;

    if (mode === 'supabase' && sb) {
      try {
        var q = sb.from('zeiten').select('*').order('start_ts', { ascending: true });
        if (from) q = q.gte('start_ts', from);
        if (to) q = q.lte('start_ts', to);
        var res = await q;
        if (res.error) throw res.error;
        (res.data || []).forEach(cachePut); // für den Offline-Fall mitspiegeln
        return { list: res.data || [], offline: false };
      } catch (e) { /* unten Cache-Fallback */ }
    }

    var fMs = from ? Date.parse(from) : -Infinity;
    var tMs = to ? Date.parse(to) : Infinity;
    var arr = cache().filter(function (z) {
      var t = Date.parse(z.start_ts);
      return t >= fMs && t <= tMs;
    }).sort(function (a, b) { return Date.parse(a.start_ts) - Date.parse(b.start_ts); });

    return { list: arr, offline: mode === 'supabase' };
  }

  /* Synchron, nur Cache: für die "Zuletzt"-Liste in der Stempeluhr. */
  function listCached(opts) {
    var fMs = opts && opts.fromMs != null ? opts.fromMs : -Infinity;
    var tMs = opts && opts.toMs != null ? opts.toMs : Infinity;
    return cache().filter(function (z) {
      var t = Date.parse(z.start_ts);
      return t >= fMs && t <= tMs;
    }).sort(function (a, b) { return Date.parse(a.start_ts) - Date.parse(b.start_ts); });
  }

  /* ------------------------------------------------------- Standorte/Personal */

  function byOrder(a, b) {
    var sa = a.sortierung == null ? 100 : a.sortierung;
    var sbv = b.sortierung == null ? 100 : b.sortierung;
    if (sa !== sbv) return sa - sbv;
    return String(a.name || a.kuerzel || '').localeCompare(String(b.name || b.kuerzel || ''));
  }

  function defaultStandorte() {
    var names = (typeof CONFIG !== 'undefined' && CONFIG.OBJEKTE) ? CONFIG.OBJEKTE : [];
    return names.map(function (n, i) {
      return { id: 'cfg-s' + i, name: n, sortierung: 100, aktiv: true };
    });
  }

  function defaultPersonal() {
    var keys = (typeof CONFIG !== 'undefined' && CONFIG.KUERZEL) ? CONFIG.KUERZEL : [];
    return keys.map(function (k, i) {
      return { id: 'cfg-p' + i, kuerzel: k, sortierung: 100, aktiv: true };
    });
  }

  async function remoteList(table, orderCol) {
    if (!sbAnon) return null;
    try {
      var res = await sbAnon.from(table).select('*')
        .order('sortierung', { ascending: true })
        .order(orderCol, { ascending: true });
      if (res.error) throw res.error;
      return res.data || [];
    } catch (e) { return null; }
  }

  async function listStandorte(opts) {
    var all = !!(opts && opts.all);
    var list = await remoteList('standorte', 'name');
    if (list) write(KEY.standorte, list);
    else list = read(KEY.standorte, null);
    if (!list) list = defaultStandorte();
    var out = list.filter(function (s) { return s && (all || s.aktiv !== false); });
    out.sort(byOrder);
    return out;
  }

  async function listPersonal(opts) {
    var all = !!(opts && opts.all);
    var list = await remoteList('personal', 'kuerzel');
    if (list) write(KEY.personal, list);
    else list = read(KEY.personal, null);
    if (!list) list = defaultPersonal();
    var out = list.filter(function (p) { return p && (all || p.aktiv !== false); });
    out.sort(byOrder);
    return out;
  }

  function demoList(key, def) {
    var list = read(key, null);
    if (!list) { list = def(); write(key, list); }
    return list;
  }

  function nameTaken(list, key, value, exceptId) {
    var v = String(value).trim().toLowerCase();
    return list.some(function (it) {
      return it.id !== exceptId && String(it[key] || '').trim().toLowerCase() === v;
    });
  }

  async function createStandort(name) {
    name = String(name || '').trim();
    if (!name) throw new Error(msg('err.nameEmpty'));
    if (mode === 'supabase') {
      if (!sb) throw new Error(msg('err.notAllowed'));
      var res = await sb.from('standorte').insert({ name: name }).select().single();
      if (res.error) throw res.error;
      var rec = res.data;
      var l = read(KEY.standorte, null) || defaultStandorte();
      l.push(rec);
      write(KEY.standorte, l);
      return rec;
    }
    var list = demoList(KEY.standorte, defaultStandorte);
    if (nameTaken(list, 'name', name)) throw new Error(msg('err.exists'));
    var neu = { id: uuid(), name: name, sortierung: 100, aktiv: true };
    list.push(neu);
    write(KEY.standorte, list);
    return neu;
  }

  async function updateStandort(id, patch) {
    patch = patch || {};
    if (mode === 'supabase') {
      if (!sb) throw new Error(msg('err.notAllowed'));
      var res = await sb.from('standorte').update(clean(patch)).eq('id', id).select().single();
      if (res.error) throw res.error;
      var l = read(KEY.standorte, null) || [];
      var i = l.findIndex(function (s) { return s.id === id; });
      if (i >= 0) l[i] = Object.assign({}, l[i], patch);
      write(KEY.standorte, l);
      return res.data;
    }
    var list = demoList(KEY.standorte, defaultStandorte);
    var j = list.findIndex(function (s) { return s.id === id; });
    if (j < 0) throw new Error(msg('err.notFound'));
    if (patch.name != null && nameTaken(list, 'name', patch.name, id)) throw new Error(msg('err.exists'));
    list[j] = Object.assign({}, list[j], clean(patch));
    write(KEY.standorte, list);
    return list[j];
  }

  async function deleteStandort(id) {
    if (mode === 'supabase') {
      if (!sb) throw new Error(msg('err.notAllowed'));
      var res = await sb.from('standorte').delete().eq('id', id);
      if (res.error) throw res.error;
      var l = read(KEY.standorte, null) || [];
      write(KEY.standorte, l.filter(function (s) { return s.id !== id; }));
      return;
    }
    var list = demoList(KEY.standorte, defaultStandorte);
    write(KEY.standorte, list.filter(function (s) { return s.id !== id; }));
  }

  async function createPersonal(kuerzel) {
    kuerzel = String(kuerzel || '').trim();
    if (!kuerzel) throw new Error(msg('err.kuerzelEmpty'));
    if (mode === 'supabase') {
      if (!sb) throw new Error(msg('err.notAllowed'));
      var res = await sb.from('personal').insert({ kuerzel: kuerzel }).select().single();
      if (res.error) throw res.error;
      var rec = res.data;
      var l = read(KEY.personal, null) || defaultPersonal();
      l.push(rec);
      write(KEY.personal, l);
      return rec;
    }
    var list = demoList(KEY.personal, defaultPersonal);
    if (nameTaken(list, 'kuerzel', kuerzel)) throw new Error(msg('err.exists'));
    var neu = { id: uuid(), kuerzel: kuerzel, sortierung: 100, aktiv: true };
    list.push(neu);
    write(KEY.personal, list);
    return neu;
  }

  async function updatePersonal(id, patch) {
    patch = patch || {};
    if (mode === 'supabase') {
      if (!sb) throw new Error(msg('err.notAllowed'));
      var res = await sb.from('personal').update(clean(patch)).eq('id', id).select().single();
      if (res.error) throw res.error;
      var l = read(KEY.personal, null) || [];
      var i = l.findIndex(function (p) { return p.id === id; });
      if (i >= 0) l[i] = Object.assign({}, l[i], patch);
      write(KEY.personal, l);
      return res.data;
    }
    var list = demoList(KEY.personal, defaultPersonal);
    var j = list.findIndex(function (p) { return p.id === id; });
    if (j < 0) throw new Error(msg('err.notFound'));
    if (patch.kuerzel != null && nameTaken(list, 'kuerzel', patch.kuerzel, id)) throw new Error(msg('err.exists'));
    list[j] = Object.assign({}, list[j], clean(patch));
    write(KEY.personal, list);
    return list[j];
  }

  async function deletePersonal(id) {
    if (mode === 'supabase') {
      if (!sb) throw new Error(msg('err.notAllowed'));
      var res = await sb.from('personal').delete().eq('id', id);
      if (res.error) throw res.error;
      var l = read(KEY.personal, null) || [];
      write(KEY.personal, l.filter(function (p) { return p.id !== id; }));
      return;
    }
    var list = demoList(KEY.personal, defaultPersonal);
    write(KEY.personal, list.filter(function (p) { return p.id !== id; }));
  }

  /* ---------------------------------------------------------------- Foto */

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(fr.error || new Error('Bild konnte nicht gelesen werden')); };
      fr.readAsDataURL(blob);
    });
  }

  /* Lädt ein bereits verkleinertes JPEG in den Bucket "fotos".
     Demo-Modus: Data-URL zurückgeben (kein Upload). */
  async function uploadFoto(file, kuerzel, id) {
    if (!file) throw new Error('kein Bild');
    if (mode !== 'supabase' || !sbAnon) return blobToDataUrl(file);

    var safe = String(kuerzel || 'x').replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 32) || 'x';
    var rnd = Math.random().toString(36).slice(2, 8);
    var path = safe + '/' + String(id || uuid()) + '-' + rnd + '.jpg';

    var up = await sbAnon.storage.from('fotos').upload(path, file, {
      contentType: file.type || 'image/jpeg',
      cacheControl: '3600',
      upsert: false
    });
    if (up.error) throw up.error;

    var pub = sbAnon.storage.from('fotos').getPublicUrl(path);
    return (pub && pub.data && pub.data.publicUrl) ? pub.data.publicUrl : null;
  }

  /* ------------------------------------------------------------------ Anmeldung */

  async function signIn(email, password) {
    if (!sb) throw new Error('Supabase ist nicht konfiguriert oder gerade nicht erreichbar.');
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) throw res.error;
    return res.data;
  }

  async function signOut() {
    if (mode === 'demo') { write(KEY.demoAuth, false); return; }
    if (sb) await sb.auth.signOut();
  }

  async function getSession() {
    if (mode === 'demo') return read(KEY.demoAuth, false) ? { demo: true } : null;
    if (!sb) return null;
    var res = await sb.auth.getSession();
    return res && res.data ? res.data.session : null;
  }

  function demoLogin(ok) { write(KEY.demoAuth, !!ok); }

  /* ------------------------------------------------------------------ Kürzel */

  function getKuerzel() { return read(KEY.kuerzel, '') || ''; }
  function setKuerzel(k) { write(KEY.kuerzel, String(k || '').trim()); }

  return {
    init: init,
    getMode: function () { return mode; },
    insertZeit: insertZeit,
    updateZeit: updateZeit,
    getOffene: getOffene,
    listZeiten: listZeiten,
    listCached: listCached,
    flush: flush,
    queueLength: function () { return queue().length; },
    listStandorte: listStandorte,
    listPersonal: listPersonal,
    createStandort: createStandort,
    updateStandort: updateStandort,
    deleteStandort: deleteStandort,
    createPersonal: createPersonal,
    updatePersonal: updatePersonal,
    deletePersonal: deletePersonal,
    uploadFoto: uploadFoto,
    insertZeitAdmin: insertZeitAdmin,
    updateZeitAdmin: updateZeitAdmin,
    setGemeldet: setGemeldet,
    setGemeldetZeitraum: setGemeldetZeitraum,
    deleteZeitAdmin: deleteZeitAdmin,
    signIn: signIn,
    signOut: signOut,
    getSession: getSession,
    demoLogin: demoLogin,
    getKuerzel: getKuerzel,
    setKuerzel: setKuerzel,
    util: {
      parts: parts,
      monthRange: monthRange,
      zonedToUtc: zonedToUtc,
      msToHms: msToHms,
      hours: hours,
      fmtHours: fmtHours,
      fmtTime: fmtTime,
      fmtDate: fmtDate,
      nowParts: nowParts
    }
  };
})();

</script>
<script>
/* admin.js */
/* admin.js – Auswertung (admin.html) */
'use strict';

(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var U = Store.util;

  var FOTO_SVG = '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">' +
    '<path d="M7.2 4.5 6.3 6H4.6A1.6 1.6 0 0 0 3 7.6v6.8A1.6 1.6 0 0 0 4.6 16h10.8a1.6 1.6 0 0 0 1.6-1.6V7.6A1.6 1.6 0 0 0 15.4 6h-1.7l-.9-1.5H7.2z" ' +
    'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<circle cx="10" cy="10.8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';

  var state = {
    rows: [],
    offline: false,
    loaded: false,
    standorte: [],
    personal: [],
    tab: 'report',
    selected: {},       // id -> true (angehakte Zeilen)
    onlyOpen: false,    // nur ungemeldete anzeigen
    editingId: null     // Zeile mit offenem Bearbeitungsfeld
  };

  var COLS = 12;

  document.addEventListener('DOMContentLoaded', boot);
  document.addEventListener('pz-langchange', onLangChange);

  async function boot() {
    $('inp-monat').value = currentMonth();
    try { await Store.init(); } catch (e) { /* Demo läuft weiter */ }
    markMode();
    updateLegend();

    var session = null;
    try { session = await Store.getSession(); } catch (e) { session = null; }
    if (session) showApp(); else showLogin();
  }

  function currentMonth() {
    var p = U.nowParts();
    return p.y + '-' + String(p.m).padStart(2, '0');
  }

  function markMode() {
    var demo = Store.getMode() === 'demo';
    $('mode-badge').textContent = demo ? t('mode.demo') : t('mode.live');
    $('mode-badge').className = 'badge ' + (demo ? 'badge-demo' : 'badge-live');
    $('login-hint').textContent = demo ? t('login.hintDemo') : t('login.hintLive');
    $('manage-demo-hint').hidden = !demo;
    if (demo) {
      $('login-email').value = 'demo@local';
      $('login-email').disabled = true;
    }
  }

  function updateLegend() {
    $('legend').textContent = t('legend', t('flags.added'), t('flags.pending'));
  }

  /* ------------------------------------------------------------- Anmeldung */

  function showLogin() {
    $('screen-login').hidden = false;
    $('screen-app').hidden = true;
  }

  function showApp() {
    $('screen-login').hidden = true;
    $('screen-app').hidden = false;
    if (!state.loaded) {
      state.loaded = true;
      load();
    }
  }

  async function onLogin(ev) {
    ev.preventDefault();
    var pw = $('login-pw').value;
    $('login-error').textContent = '';

    if (Store.getMode() === 'demo') {
      if (pw === 'demo') {
        Store.demoLogin(true);
        showApp();
      } else {
        $('login-error').textContent = t('login.wrongDemo');
      }
      return;
    }

    try {
      await Store.signIn($('login-email').value.trim(), pw);
      showApp();
    } catch (e) {
      $('login-error').textContent = t('login.failed', (e && e.message) ? e.message : '?');
    }
  }

  async function onLogout() {
    try { await Store.signOut(); } catch (e) { /* egal */ }
    state.loaded = false;
    state.rows = [];
    state.selected = {};
    state.editingId = null;
    $('login-pw').value = '';
    showLogin();
  }

  /* ------------------------------------------------------------- Daten laden */

  async function load() {
    var monat = $('inp-monat').value || currentMonth();
    var teile = monat.split('-').map(Number);
    var r = U.monthRange(teile[0], teile[1]);

    $('status-line').textContent = t('status.loading');
    if (!state.personal.length) {
      try { state.personal = await Store.listPersonal({ all: true }); } catch (e) { /* egal */ }
    }
    if (!state.standorte.length) {
      try { state.standorte = await Store.listStandorte({ all: true }); } catch (e) { /* egal */ }
    }
    var res = await Store.listZeiten({ from: r.from, to: r.to });
    state.offline = !!res.offline;
    state.rows = res.list.map(function (z) {
      var dauer = z.ende_ts ? Date.parse(z.ende_ts) - Date.parse(z.start_ts) : null;
      var auffaellig = dauer === null || dauer < 10 * 60000 || dauer > 12 * 3600000;
      return { z: z, dauer: dauer, auffaellig: auffaellig };
    });

    updateStatus();
    buildFilter();
    fillAddForm();
    render();
    return;
  }

  /* Auswahllisten + Datum im Nachtrag-Formular füllen. */
  function fillAddForm() {
    var kuSel = $('sel-add-kuerzel');
    var obSel = $('sel-add-objekt');
    if (!kuSel || !obSel) return;

    var kuerzelSet = {};
    var objektSet = {};
    (state.personal || []).forEach(function (p) { if (p.aktiv !== false) kuerzelSet[p.kuerzel] = 1; });
    (state.standorte || []).forEach(function (s) { if (s.aktiv !== false) objektSet[s.name] = 1; });
    state.rows.forEach(function (r) { kuerzelSet[r.z.kuerzel] = 1; objektSet[r.z.objekt] = 1; });
    /* CONFIG nur als Rückfallebene, wenn aus der Datenbank nichts kam */
    if (!Object.keys(kuerzelSet).length) {
      (typeof CONFIG !== 'undefined' && CONFIG.KUERZEL ? CONFIG.KUERZEL : []).forEach(function (k) { kuerzelSet[k] = 1; });
    }
    if (!Object.keys(objektSet).length) {
      (typeof CONFIG !== 'undefined' && CONFIG.OBJEKTE ? CONFIG.OBJEKTE : []).forEach(function (o) { objektSet[o] = 1; });
    }

    var kuKeep = kuSel.value;
    var obKeep = obSel.value;
    fillSelect(kuSel, Object.keys(kuerzelSet).sort(), t('add.choose'), kuKeep);
    fillSelect(obSel, Object.keys(objektSet).sort(), t('add.choose'), obKeep);
    if (kuSel.options.length > 1 && !kuSel.value) kuSel.selectedIndex = 1;
    if (obSel.options.length > 1 && !obSel.value) obSel.selectedIndex = 1;

    if (!$('inp-add-datum').value) {
      var p = U.nowParts();
      $('inp-add-datum').value = p.y + '-' + String(p.m).padStart(2, '0') + '-' + String(p.d).padStart(2, '0');
    }
  }

  async function onAdd(ev) {
    ev.preventDefault();
    $('add-hint').textContent = '';

    var datum = $('inp-add-datum').value;
    var von = $('inp-add-von').value;
    var bis = $('inp-add-bis').value;
    var kuerzel = $('sel-add-kuerzel').value;
    var objekt = $('sel-add-objekt').value;

    if (!datum || !von || !bis || !kuerzel || !objekt) {
      $('add-hint').textContent = t('add.fields');
      return;
    }
    var d = datum.split('-').map(Number);
    var v = von.split(':').map(Number);
    var b = bis.split(':').map(Number);
    if (b[0] * 60 + b[1] <= v[0] * 60 + v[1]) {
      $('add-hint').textContent = t('add.order');
      return;
    }

    var start = U.zonedToUtc(d[0], d[1], d[2], v[0], v[1]);
    var ende = U.zonedToUtc(d[0], d[1], d[2], b[0], b[1]);

    try {
      var rec = await Store.insertZeitAdmin({
        kuerzel: kuerzel,
        objekt: objekt,
        start_ts: new Date(start).toISOString(),
        ende_ts: new Date(ende).toISOString(),
        notiz: $('inp-add-notiz').value.trim() || null
      });
      $('inp-add-notiz').value = '';
      $('add-hint').textContent = t('add.saved', U.fmtHours(ende - start));
      await load();
      /* Kurz nachfassen, falls der Abruf den neuen Eintrag noch nicht liefert. */
      if (!state.rows.some(function (r) { return r.z.id === rec.id; })) {
        await new Promise(function (res) { setTimeout(res, 1500); });
        await load();
      }
    } catch (e) {
      $('add-hint').textContent = t('manage.error', (e && e.message) ? e.message : '?');
    }
  }

  async function onDeleteRow(id) {
    if (!window.confirm(t('table.confirmDelete'))) return;
    try {
      await Store.deleteZeitAdmin(id);
      $('add-hint').textContent = t('table.deleted');
      await load();
    } catch (e) {
      $('add-hint').textContent = t('manage.error', (e && e.message) ? e.message : '?');
    }
  }

  function updateStatus() {
    $('status-line').textContent = state.offline
      ? t('status.offline')
      : t('status.count', state.rows.length);
  }

  function buildFilter() {
    var ku = $('filter-kuerzel');
    var ob = $('filter-objekt');
    var kuerzelSet = {};
    var objektSet = {};

    state.rows.forEach(function (r) {
      kuerzelSet[r.z.kuerzel] = 1;
      objektSet[r.z.objekt] = 1;
    });
    (state.personal || []).forEach(function (p) { kuerzelSet[p.kuerzel] = 1; });
    (state.standorte || []).forEach(function (s) { objektSet[s.name] = 1; });
    if (!Object.keys(kuerzelSet).length) {
      (typeof CONFIG !== 'undefined' && CONFIG.KUERZEL ? CONFIG.KUERZEL : []).forEach(function (k) { kuerzelSet[k] = 1; });
    }
    if (!Object.keys(objektSet).length) {
      (typeof CONFIG !== 'undefined' && CONFIG.OBJEKTE ? CONFIG.OBJEKTE : []).forEach(function (o) { objektSet[o] = 1; });
    }

    fillSelect(ku, Object.keys(kuerzelSet).sort(), t('filter.allKuerzel'), ku.value);
    fillSelect(ob, Object.keys(objektSet).sort(), t('filter.allObjekte'), ob.value);
  }

  function fillSelect(sel, values, alleText, keep) {
    sel.textContent = '';
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = alleText;
    sel.appendChild(opt);
    values.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      sel.appendChild(o);
    });
    if (keep && values.indexOf(keep) >= 0) sel.value = keep;
  }

  function filtered() {
    var k = $('filter-kuerzel').value;
    var o = $('filter-objekt').value;
    return state.rows.filter(function (r) {
      return (!k || r.z.kuerzel === k) && (!o || r.z.objekt === o);
    });
  }

  /* Tabelle: zusätzlich der Filter "nur ungemeldete" (Summen bleiben unberührt). */
  function tableRows() {
    var rows = filtered();
    if (state.onlyOpen) rows = rows.filter(function (r) { return !r.z.gemeldet; });
    return rows;
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  /* ------------------------------------------------------------- Darstellung */

  function render() {
    renderTable(tableRows());
    renderNotes(filtered());
    renderSums(filtered());
    renderMelde();
  }

  function safeUrl(u) {
    u = String(u || '');
    return /^(https?:\/\/|data:image\/(png|jpe?g|webp|gif);)/i.test(u) ? u : '';
  }

  function fotoLink(url) {
    var href = safeUrl(url);
    if (!href) return null;
    var a = document.createElement('a');
    a.className = 'foto-link';
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', t('photo.open'));
    a.title = t('photo.open');
    a.innerHTML = FOTO_SVG; // statisches SVG, keine Nutzdaten
    return a;
  }

  function renderTable(rows) {
    var tb = $('tbody');
    tb.textContent = '';

    syncCheckAll(rows);

    if (!rows.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = COLS;
      td.className = 'empty';
      td.textContent = t('table.empty');
      tr.appendChild(td);
      tb.appendChild(tr);
      return;
    }

    rows.forEach(function (r) {
      var z = r.z;
      var tr = document.createElement('tr');
      var cls = [];
      if (r.auffaellig) cls.push('warn');
      if (z.gemeldet) cls.push('is-gemeldet');
      if (cls.length) tr.className = cls.join(' ');

      /* Auswahl */
      var tdChk = document.createElement('td');
      tdChk.className = 'col-check';
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'row-check';
      chk.setAttribute('data-id', z.id);
      chk.checked = !!state.selected[z.id];
      chk.setAttribute('aria-label', t('table.selectRow'));
      chk.addEventListener('change', function () {
        if (chk.checked) state.selected[z.id] = true;
        else delete state.selected[z.id];
        syncCheckAll(rows);
        renderMelde();
      });
      tdChk.appendChild(chk);
      tr.appendChild(tdChk);

      addCell(tr, U.fmtDate(z.start_ts));
      addCell(tr, z.kuerzel);
      addCell(tr, z.objekt);
      addCell(tr, U.fmtTime(z.start_ts));
      addCell(tr, z.ende_ts ? U.fmtTime(z.ende_ts) : '–');
      addCell(tr, r.dauer === null ? t('table.running') : U.fmtHours(r.dauer), 'num');

      /* Notiz der Reinigungskraft: voller Text, umbrechend; Foto als Symbol */
      var tdNote = document.createElement('td');
      tdNote.className = 'note';
      tdNote.textContent = z.notiz || '';
      var link = fotoLink(z.foto_url);
      if (link) tdNote.appendChild(link);
      tr.appendChild(tdNote);

      /* Status: gemeldet (grün, mit Datum) / bearbeitet (grau) */
      var tdStatus = document.createElement('td');
      var sbox = document.createElement('div');
      sbox.className = 'flags';
      if (z.gemeldet) {
        sbox.appendChild(badge(
          z.gemeldet_am ? t('badge.gemeldetOn', U.fmtDate(z.gemeldet_am)) : t('badge.gemeldet'),
          'badge-ok'
        ));
      }
      if (z.bearbeitet) sbox.appendChild(badge(t('badge.edited'), 'badge-edited'));
      tdStatus.appendChild(sbox);
      tr.appendChild(tdStatus);

      /* Kommentar des Eigentümers */
      var tdComment = document.createElement('td');
      tdComment.className = 'note comment';
      tdComment.textContent = z.admin_notiz || '';
      tr.appendChild(tdComment);

      var td = document.createElement('td');
      var box = document.createElement('div');
      box.className = 'flags';
      if (z.nachgetragen) box.appendChild(badge(t('flags.added'), 'badge-nachtrag'));
      if (r.auffaellig) box.appendChild(badge(t('flags.unusual'), 'badge-warn'));
      if (z._pending) box.appendChild(badge(t('flags.pending'), 'badge-pending'));
      td.appendChild(box);
      tr.appendChild(td);

      var tdAct = document.createElement('td');
      tdAct.className = 'row-action';
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'btn btn-sm btn-ghost';
      edit.textContent = t('table.edit');
      edit.addEventListener('click', function () {
        state.editingId = state.editingId === z.id ? null : z.id;
        render();
      });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn btn-sm btn-ghost btn-danger-text';
      del.textContent = '×';
      del.title = t('table.delete');
      del.setAttribute('aria-label', t('table.delete'));
      del.addEventListener('click', function () { onDeleteRow(z.id); });
      tdAct.appendChild(edit);
      tdAct.appendChild(del);
      tr.appendChild(tdAct);

      tb.appendChild(tr);

      if (state.editingId === z.id) tb.appendChild(buildEditRow(z));
    });
  }

  /* Kopf-Checkbox an die sichtbaren Zeilen anpassen. */
  function syncCheckAll(rows) {
    var all = $('chk-all');
    if (!all) return;
    var vis = rows || tableRows();
    var n = 0;
    vis.forEach(function (r) { if (state.selected[r.z.id]) n++; });
    all.checked = vis.length > 0 && n === vis.length;
    all.indeterminate = n > 0 && n < vis.length;
  }

  function fieldVal(id) {
    var el = document.getElementById(id);
    return el ? el.value : '';
  }

  function labeledField(id, label, input) {
    var lab = document.createElement('label');
    lab.className = 'field';
    lab.setAttribute('for', id);
    var sp = document.createElement('span');
    sp.textContent = label;
    lab.appendChild(sp);
    input.id = id;
    lab.appendChild(input);
    return lab;
  }

  function inputField(id, label, type, value, maxLength) {
    var inp = document.createElement('input');
    inp.type = type;
    if (maxLength) inp.maxLength = maxLength;
    inp.value = value == null ? '' : String(value);
    if (type !== 'date' && type !== 'time') inp.autocomplete = 'off';
    return labeledField(id, label, inp);
  }

  function selectField(id, label, values, value) {
    var sel = document.createElement('select');
    if (value && values.indexOf(value) < 0) values = values.concat([value]);
    values.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      sel.appendChild(o);
    });
    sel.value = value || '';
    return labeledField(id, label, sel);
  }

  /* Werte für die Auswahllisten im Bearbeitungsfeld (Stammdaten + Bestand). */
  function editKuerzel() {
    var set = {};
    (state.personal || []).forEach(function (p) { if (p.aktiv !== false) set[p.kuerzel] = 1; });
    state.rows.forEach(function (r) { set[r.z.kuerzel] = 1; });
    return Object.keys(set).sort();
  }

  function editObjekte() {
    var set = {};
    (state.standorte || []).forEach(function (s) { if (s.aktiv !== false) set[s.name] = 1; });
    state.rows.forEach(function (r) { set[r.z.objekt] = 1; });
    return Object.keys(set).sort();
  }

  function buildEditRow(z) {
    var tr = document.createElement('tr');
    tr.className = 'edit-row';
    var td = document.createElement('td');
    td.colSpan = COLS;

    var form = document.createElement('div');
    form.className = 'edit-form';

    var p = U.parts(z.start_ts);
    var pe = z.ende_ts ? U.parts(z.ende_ts) : null;
    var datum = p.y + '-' + pad2(p.m) + '-' + pad2(p.d);
    var vonStr = pad2(p.h) + ':' + pad2(p.mi);
    var bisStr = pe ? pad2(pe.h) + ':' + pad2(pe.mi) : '';

    form.appendChild(inputField('edit-datum', t('add.date'), 'date', datum));
    form.appendChild(inputField('edit-von', t('add.from'), 'time', vonStr));
    form.appendChild(inputField('edit-bis', t('add.to'), 'time', bisStr));
    form.appendChild(selectField('edit-kuerzel', t('add.kuerzel'), editKuerzel(), z.kuerzel));
    form.appendChild(selectField('edit-objekt', t('add.objekt'), editObjekte(), z.objekt));

    var notiz = inputField('edit-notiz', t('add.note'), 'text', z.notiz || '', 300);
    notiz.className += ' grow';
    form.appendChild(notiz);

    var kommentar = inputField('edit-admin-notiz', t('edit.comment'), 'text', z.admin_notiz || '', 500);
    kommentar.className += ' grow';
    form.appendChild(kommentar);

    var actions = document.createElement('div');
    actions.className = 'edit-actions';
    var save = document.createElement('button');
    save.type = 'button';
    save.className = 'btn btn-primary btn-sm';
    save.textContent = t('edit.save');
    save.addEventListener('click', function () { onEditSave(z.id); });
    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn btn-ghost btn-sm';
    cancel.textContent = t('edit.cancel');
    cancel.addEventListener('click', function () {
      state.editingId = null;
      render();
    });
    actions.appendChild(save);
    actions.appendChild(cancel);
    form.appendChild(actions);
    td.appendChild(form);
    tr.appendChild(td);

    td.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); state.editingId = null; render(); }
    });

    return tr;
  }

  async function onEditSave(id) {
    $('add-hint').textContent = '';

    var datum = fieldVal('edit-datum');
    var von = fieldVal('edit-von');
    var bis = fieldVal('edit-bis');
    var kuerzel = fieldVal('edit-kuerzel');
    var objekt = fieldVal('edit-objekt');

    if (!datum || !von || !bis || !kuerzel || !objekt) {
      $('add-hint').textContent = t('edit.fields');
      return;
    }
    var d = datum.split('-').map(Number);
    var v = von.split(':').map(Number);
    var b = bis.split(':').map(Number);
    if (b[0] * 60 + b[1] <= v[0] * 60 + v[1]) {
      $('add-hint').textContent = t('edit.order');
      return;
    }

    var start = U.zonedToUtc(d[0], d[1], d[2], v[0], v[1]);
    var ende = U.zonedToUtc(d[0], d[1], d[2], b[0], b[1]);
    var notiz = fieldVal('edit-notiz').trim();
    var kommentar = fieldVal('edit-admin-notiz').trim();

    try {
      await Store.updateZeitAdmin(id, {
        start_ts: new Date(start).toISOString(),
        ende_ts: new Date(ende).toISOString(),
        kuerzel: kuerzel,
        objekt: objekt,
        notiz: notiz || null,
        admin_notiz: kommentar || null
      });
      state.editingId = null;
      $('add-hint').textContent = t('edit.saved');
      await load();
    } catch (e) {
      $('add-hint').textContent = t('manage.error', (e && e.message) ? e.message : '?');
    }
  }

  /* -------------------------------------------------------- Melde-Leiste */

  function completedRows(rows) {
    return rows.filter(function (r) { return r.dauer !== null; });
  }

  function selectedIds() {
    var known = {};
    state.rows.forEach(function (r) { known[r.z.id] = 1; });
    return Object.keys(state.selected).filter(function (id) {
      return state.selected[id] && known[id];
    });
  }

  var meldeFlash = null;
  function meldeHint(text) {
    var el = $('melde-hint');
    if (!el) return;
    el.textContent = text || '';
    clearTimeout(meldeFlash);
    if (text) meldeFlash = setTimeout(function () { el.textContent = ''; }, 6000);
  }

  function renderMelde() {
    var rows = filtered();
    var done = completedRows(rows);
    var laufend = rows.length - done.length;
    var gemeldet = done.filter(function (r) { return !!r.z.gemeldet; }).length;

    $('melde-summary').textContent = laufend
      ? t('melde.summaryRunning', gemeldet, done.length, laufend)
      : t('melde.summary', gemeldet, done.length);

    var n = selectedIds().length;
    var mark = $('btn-mark-selected');
    var unmark = $('btn-unmark-selected');
    mark.textContent = t('melde.markSelected', n);
    mark.disabled = n === 0;
    unmark.textContent = t('melde.unmarkSelected');
    unmark.disabled = n === 0;
  }

  async function onMarkSelected(gemeldet) {
    var ids = selectedIds();
    if (!ids.length) return;
    try {
      var n = await Store.setGemeldet(ids, gemeldet);
      state.selected = {};
      meldeHint(t(gemeldet ? 'melde.marked' : 'melde.unmarked', n));
      await load();
    } catch (e) {
      meldeHint(t('manage.error', (e && e.message) ? e.message : '?'));
    }
  }

  async function onMarkMonth() {
    var offen = completedRows(filtered()).filter(function (r) { return !r.z.gemeldet; }).length;
    if (!offen) { meldeHint(t('melde.none')); return; }
    if (!window.confirm(t('melde.confirmMonth', offen))) return;

    var monat = $('inp-monat').value || currentMonth();
    var teile = monat.split('-').map(Number);
    var r = U.monthRange(teile[0], teile[1]);

    try {
      var n = await Store.setGemeldetZeitraum({
        from: r.from,
        to: new Date(r.toMs + 1).toISOString(), // exklusives Ende = Monatsanfang danach
        kuerzel: $('filter-kuerzel').value || null,
        objekt: $('filter-objekt').value || null,
        gemeldet: true
      });
      state.selected = {};
      meldeHint(t('melde.marked', n));
      await load();
    } catch (e) {
      meldeHint(t('manage.error', (e && e.message) ? e.message : '?'));
    }
  }

  function onCheckAll(checked) {
    tableRows().forEach(function (r) {
      if (checked) state.selected[r.z.id] = true;
      else delete state.selected[r.z.id];
    });
    render();
  }

  function addCell(tr, text, cls) {
    var td = document.createElement('td');
    if (cls) td.className = cls;
    td.textContent = text; // immer textContent: keine Nutzdaten als HTML
    tr.appendChild(td);
  }

  function badge(text, cls) {
    var s = document.createElement('span');
    s.className = 'badge ' + cls;
    s.textContent = text;
    return s;
  }

  /* Notizen des Monats als eigener Block über der Tabelle. */
  function renderNotes(rows) {
    var ul = $('notes-list');
    ul.textContent = '';
    var list = rows.filter(function (r) {
      return (r.z.notiz && String(r.z.notiz).trim()) ||
             (r.z.admin_notiz && String(r.z.admin_notiz).trim());
    });

    if (!list.length) {
      var le = document.createElement('li');
      le.className = 'empty';
      le.textContent = t('notes.empty');
      ul.appendChild(le);
      return;
    }

    list.forEach(function (r) {
      var z = r.z;
      var li = document.createElement('li');
      li.className = 'entry note-entry';

      var main = document.createElement('div');
      main.className = 'entry-main';
      var head = document.createElement('strong');
      head.textContent = U.fmtDate(z.start_ts) + ' · ' + z.kuerzel + ' · ' + z.objekt;
      var text = document.createElement('span');
      text.className = 'note-text';
      text.textContent = z.notiz;
      main.appendChild(head);
      main.appendChild(text);

      if (z.admin_notiz && String(z.admin_notiz).trim()) {
        var comment = document.createElement('span');
        comment.className = 'note-comment';
        comment.textContent = t('notes.commentPrefix') + ' ' + z.admin_notiz;
        main.appendChild(comment);
      }

      var side = document.createElement('div');
      side.className = 'entry-side';
      var href = safeUrl(z.foto_url);
      if (href) {
        var a = document.createElement('a');
        a.className = 'thumb-link';
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        var img = document.createElement('img');
        img.className = 'thumb';
        img.src = href;
        img.alt = t('photo.thumbAlt');
        img.loading = 'lazy';
        a.appendChild(img);
        side.appendChild(a);
      }

      li.appendChild(main);
      li.appendChild(side);
      ul.appendChild(li);
    });
  }

  function renderSums(rows) {
    var proKuerzel = {};
    var proObjekt = {};
    var gesamt = 0;

    rows.forEach(function (r) {
      if (r.dauer === null) return; // laufende Einsätze zählen nicht
      var h = U.hours(r.dauer);
      gesamt += h;
      if (!proKuerzel[r.z.kuerzel]) proKuerzel[r.z.kuerzel] = { n: 0, h: 0 };
      proKuerzel[r.z.kuerzel].n += 1;
      proKuerzel[r.z.kuerzel].h += h;
      proObjekt[r.z.objekt] = (proObjekt[r.z.objekt] || 0) + h;
    });

    var box = $('sums');
    box.textContent = '';

    box.appendChild(sumCard(t('sums.month'), U.fmtHours(gesamt * 3600000) + ' h',
      t(rows.length === 1 ? 'sums.shiftsOne' : 'sums.shifts', rows.length)));

    Object.keys(proKuerzel).sort().forEach(function (k) {
      box.appendChild(sumCard(t('sums.kuerzel', k), U.fmtHours(proKuerzel[k].h * 3600000) + ' h',
        t(proKuerzel[k].n === 1 ? 'sums.shiftOne' : 'sums.shiftN', proKuerzel[k].n)));
    });

    Object.keys(proObjekt).sort().forEach(function (o) {
      box.appendChild(sumCard(t('sums.objekt', o), U.fmtHours(proObjekt[o] * 3600000) + ' h', ''));
    });
  }

  function sumCard(titel, wert, sub) {
    var d = document.createElement('div');
    d.className = 'sum';
    var t = document.createElement('span');
    t.className = 'sum-title';
    t.textContent = titel;
    var v = document.createElement('strong');
    v.className = 'sum-value';
    v.textContent = wert;
    d.appendChild(t);
    d.appendChild(v);
    if (sub) {
      var s = document.createElement('span');
      s.className = 'sum-sub';
      s.textContent = sub;
      d.appendChild(s);
    }
    return d;
  }

  /* ------------------------------------------------------------- CSV-Export */

  function csvCell(value) {
    var s = value == null ? '' : String(value);
    if (/[;"\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCsv() {
    var rows = filtered();
    var lines = [[
      t('csv.date'), t('csv.kuerzel'), t('csv.objekt'), t('csv.from'), t('csv.to'),
      t('csv.hours'), t('csv.note'), t('csv.gemeldet'), t('csv.comment'),
      t('csv.added'), t('csv.unusual')
    ].map(csvCell).join(';')];

    rows.forEach(function (r) {
      var z = r.z;
      var std = r.dauer === null ? '' : U.fmtHours(r.dauer);
      lines.push([
        U.fmtDate(z.start_ts),
        z.kuerzel,
        z.objekt,
        U.fmtTime(z.start_ts),
        z.ende_ts ? U.fmtTime(z.ende_ts) : '',
        std,
        z.notiz || '',
        z.gemeldet ? (z.gemeldet_am ? U.fmtDate(z.gemeldet_am) : t('csv.yes')) : '',
        z.admin_notiz || '',
        z.nachgetragen ? t('csv.yes') : t('csv.no'),
        r.auffaellig ? t('csv.yes') : t('csv.no')
      ].map(csvCell).join(';'));
    });

    // UTF-8 BOM, damit Excel die Umlaute richtig liest
    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Putzzeiten_' + ($('inp-monat').value || currentMonth()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ------------------------------------------------------------- Verwalten */

  function setTab(name) {
    state.tab = name;
    var report = name === 'report';
    $('pane-report').hidden = !report;
    $('pane-manage').hidden = report;
    $('tab-report').classList.toggle('is-active', report);
    $('tab-manage').classList.toggle('is-active', !report);
    $('tab-report').setAttribute('aria-selected', String(report));
    $('tab-manage').setAttribute('aria-selected', String(!report));
    if (!report) loadManage();
  }

  async function loadManage() {
    try { state.standorte = await Store.listStandorte({ all: true }); } catch (e) { state.standorte = []; }
    try { state.personal = await Store.listPersonal({ all: true }); } catch (e) { state.personal = []; }
    renderManage();
  }

  function renderManage() {
    renderManageList($('list-standorte'), state.standorte, 'standort');
    renderManageList($('list-personal'), state.personal, 'personal');
  }

  function labelOf(it, kind) {
    return kind === 'standort' ? String(it.name || '') : String(it.kuerzel || '');
  }

  function mkBtn(text, cls, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-sm ' + (cls || 'btn-ghost');
    b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }

  function renderManageList(ul, items, kind) {
    ul.textContent = '';
    if (!items || !items.length) {
      var le = document.createElement('li');
      le.className = 'empty';
      le.textContent = t('manage.empty');
      ul.appendChild(le);
      return;
    }

    items.forEach(function (it) {
      var li = document.createElement('li');
      li.className = 'admin-row';

      var main = document.createElement('div');
      main.className = 'admin-row-main';
      var strong = document.createElement('strong');
      strong.textContent = labelOf(it, kind);
      main.appendChild(strong);
      if (it.aktiv === false) main.appendChild(badge(t('manage.inactive'), 'badge-pending'));

      var actions = document.createElement('div');
      actions.className = 'admin-row-actions';
      actions.appendChild(mkBtn(t('manage.rename'), 'btn-ghost', function () {
        startRename(main, it, kind, actions);
      }));
      actions.appendChild(mkBtn(
        it.aktiv === false ? t('manage.activate') : t('manage.deactivate'),
        'btn-ghost',
        function () { setActive(it, kind); }
      ));
      actions.appendChild(mkBtn(t('manage.delete'), 'btn-ghost btn-danger-text', function () {
        removeItem(it, kind);
      }));

      li.appendChild(main);
      li.appendChild(actions);
      ul.appendChild(li);
    });
  }

  function startRename(main, it, kind, actions) {
    main.textContent = '';
    if (actions) actions.hidden = true;
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    input.maxLength = kind === 'standort' ? 60 : 12;
    input.value = labelOf(it, kind);
    input.setAttribute('aria-label', t('manage.rename'));

    var row = document.createElement('div');
    row.className = 'row rename-row';
    row.appendChild(input);
    row.appendChild(mkBtn(t('manage.save'), 'btn-primary', function () { saveRename(it, kind, input.value); }));
    row.appendChild(mkBtn(t('manage.cancel'), 'btn-ghost', function () { renderManage(); }));
    main.appendChild(row);
    input.focus();
    input.select();

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveRename(it, kind, input.value); }
      if (e.key === 'Escape') { e.preventDefault(); renderManage(); }
    });
  }

  async function saveRename(it, kind, value) {
    var v = String(value || '').trim();
    if (!v) { flash(t('err.nameEmpty')); return; }
    try {
      if (kind === 'standort') await Store.updateStandort(it.id, { name: v });
      else await Store.updatePersonal(it.id, { kuerzel: v });
      flash(t('manage.saved'));
      await loadManage();
    } catch (e) {
      flash(t('manage.error', (e && e.message) ? e.message : '?'));
    }
  }

  async function setActive(it, kind) {
    try {
      var patch = { aktiv: it.aktiv === false };
      if (kind === 'standort') await Store.updateStandort(it.id, patch);
      else await Store.updatePersonal(it.id, patch);
      await loadManage();
    } catch (e) {
      flash(t('manage.error', (e && e.message) ? e.message : '?'));
    }
  }

  async function removeItem(it, kind) {
    var label = labelOf(it, kind);
    if (!window.confirm(t('manage.confirmDelete', label))) return;
    try {
      if (kind === 'standort') await Store.deleteStandort(it.id);
      else await Store.deletePersonal(it.id);
      flash(t('manage.deleted'));
      await loadManage();
    } catch (e) {
      flash(t('manage.error', (e && e.message) ? e.message : '?'));
    }
  }

  function flash(text) {
    var el = $('manage-hint');
    el.textContent = text || '';
    clearTimeout(flash._t);
    if (text) flash._t = setTimeout(function () { el.textContent = ''; }, 6000);
  }

  async function onCreate(kind, inputId) {
    var input = $(inputId);
    var v = String(input.value || '').trim();
    if (!v) return;
    try {
      if (kind === 'standort') await Store.createStandort(v);
      else await Store.createPersonal(v);
      input.value = '';
      flash(t('manage.saved'));
      await loadManage();
    } catch (e) {
      flash(t('manage.error', (e && e.message) ? e.message : '?'));
    }
  }

  /* ------------------------------------------------------------- Sprache */

  function onLangChange() {
    markMode();
    updateLegend();
    if (state.loaded) {
      buildFilter();
      render();
      updateStatus();
      if (state.tab === 'manage') renderManage();
    }
  }

  /* ------------------------------------------------------------- Events */

  $('form-login').addEventListener('submit', onLogin);
  $('btn-logout').addEventListener('click', onLogout);
  $('btn-reload').addEventListener('click', load);
  $('inp-monat').addEventListener('change', load);
  $('filter-kuerzel').addEventListener('change', render);
  $('filter-objekt').addEventListener('change', render);
  $('chk-all').addEventListener('change', function () { onCheckAll($('chk-all').checked); });
  $('chk-only-open').addEventListener('change', function () {
    state.onlyOpen = !!$('chk-only-open').checked;
    render();
  });
  $('btn-mark-selected').addEventListener('click', function () { onMarkSelected(true); });
  $('btn-unmark-selected').addEventListener('click', function () { onMarkSelected(false); });
  $('btn-mark-month').addEventListener('click', onMarkMonth);
  $('btn-csv').addEventListener('click', exportCsv);
  $('form-add').addEventListener('submit', onAdd);
  $('tab-report').addEventListener('click', function () { setTab('report'); });
  $('tab-manage').addEventListener('click', function () { setTab('manage'); });
  $('form-standort').addEventListener('submit', function (ev) {
    ev.preventDefault();
    onCreate('standort', 'inp-standort');
  });
  $('form-personal').addEventListener('submit', function (ev) {
    ev.preventDefault();
    onCreate('personal', 'inp-personal');
  });
})();

</script>
</body>
</html>
